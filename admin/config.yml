backend:
  name: github
  repo: jamesbaroniharrison-maker/Baroni-Applied-Intelligence
  branch: main
  # base_url points at the OAuth proxy — a small service that lets GitHub
  # confirm it's really you before the CMS can commit to this repo. See
  # CMS_SETUP.md in the repo root for how this was set up.
  base_url: https://mywebsite.james-baroniharrison.workers.dev

media_folder: "uploads"
public_folder: "/uploads"

# Field names match content/*.json, which script.js renders into index.html.
collections:
  - name: "site"
    label: "Site Settings"
    files:
      - name: "site"
        label: "Site Content"
        file: "content/site.json"
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string", hint: "Short line next to the gold diamond above the headline" }
              - label: "Headline"
                name: "headline_lines"
                widget: "list"
                field: { label: "Part", name: "line", widget: "string" }
                hint: "The parts are joined into one headline. The last part is shown in gold italics."
              - { label: "Subheading", name: "sub", widget: "text" }
              - { label: "Primary button label", name: "primary_cta_label", widget: "string" }
              - { label: "Primary button target section id", name: "primary_cta_target", widget: "string", hint: "e.g. work — no # symbol" }
              - { label: "Secondary button label", name: "secondary_cta_label", widget: "string" }
              - { label: "Secondary button target section id", name: "secondary_cta_target", widget: "string", hint: "e.g. book — no # symbol" }

          - label: "How it works section"
            name: "how"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }

          - label: "Case studies section"
            name: "work"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }

          - label: "Services section"
            name: "services"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }

          - label: "FAQ section"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }

          - label: "Credentials section"
            name: "credentials"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }

          - label: "Book a call section"
            name: "book"
            widget: "object"
            fields:
              - { label: "Eyebrow", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Heading — gold italic ending", name: "heading_emphasis", widget: "string", required: false }
              - { label: "Body", name: "body", widget: "text" }
              - { label: "Email address", name: "email", widget: "string" }
              - { label: "LinkedIn URL", name: "linkedin_url", widget: "string" }
              - { label: "GitHub URL", name: "github_url", widget: "string" }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }

          - label: "Sections"
            name: "settings"
            widget: "object"
            fields:
              - label: "Visible sections"
                name: "sections"
                widget: "object"
                fields:
                  - { label: "Proof strip", name: "proof", widget: "boolean" }
                  - { label: "How it works", name: "how", widget: "boolean" }
                  - { label: "Case studies", name: "work", widget: "boolean" }
                  - { label: "Services", name: "services", widget: "boolean" }
                  - { label: "FAQ", name: "faq", widget: "boolean" }
                  - { label: "Credentials", name: "credentials", widget: "boolean" }
                  - { label: "Book a call", name: "book", widget: "boolean" }

  - name: "work"
    label: "Case Studies"
    files:
      - name: "work"
        label: "Case Studies"
        file: "content/work.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{label}}"
            fields:
              - { label: "Short label", name: "label", widget: "string", required: false, hint: "Shown after BUILD 01, e.g. Content pipeline" }
              - { label: "Headline (result)", name: "title", widget: "string", hint: "Lead with the result" }
              - { label: "Headline — gold italic ending", name: "title_emphasis", widget: "string", required: false }
              - { label: "Meta line", name: "meta", widget: "string", required: false, default: "Solo · end-to-end" }
              - { label: "Description", name: "description", widget: "text" }
              - label: "Steps (optional)"
                name: "flow"
                widget: "list"
                required: false
                field: { label: "Step", name: "step", widget: "string" }
                hint: "The real stages this project goes through, in order — leave empty to hide the strip."
              - { label: "Highlighted step number (optional)", name: "highlight_step", widget: "number", value_type: "int", required: false, hint: "e.g. 3 highlights the third step in gold" }
              - { label: "Highlighted step tag (optional)", name: "highlight_label", widget: "string", required: false, hint: "Short word after the step number, e.g. You" }
              - label: "Tool tags"
                name: "tags"
                widget: "list"
                field: { label: "Tag", name: "tag", widget: "string" }

  - name: "services"
    label: "Services"
    files:
      - name: "services"
        label: "Service Items"
        file: "content/services.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "One-line description", name: "description", widget: "text" }

  - name: "faq"
    label: "FAQ"
    files:
      - name: "faq"
        label: "Questions"
        file: "content/faq.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: "credentials"
    label: "Credentials"
    files:
      - name: "credentials"
        label: "Education & Certification"
        file: "content/credentials.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
              - label: "Status"
                name: "status"
                widget: "select"
                options:
                  - { label: "In progress", value: "in_progress" }
                  - { label: "Completed", value: "completed" }
                  - { label: "Link (e.g. verify on Credly)", value: "link" }
              - { label: "Link label", name: "link_label", widget: "string", required: false, hint: "Only used when Status is Link" }
              - { label: "Link URL", name: "link_url", widget: "string", required: false, hint: "Only used when Status is Link" }

  - name: "process"
    label: "How It Works"
    files:
      - name: "process"
        label: "Steps"
        file: "content/process.json"
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "text" }
